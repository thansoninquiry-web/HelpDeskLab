<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <meta
      name="description"
      content="HelpDeskLab — local-first Tier 1 IT help desk practice with procedurally generated tickets."
    />
    <title>HelpDeskLab</title>
    <script>
      // Paints the cached workspace theme before the first frame, so the chosen
      // workspace never flashes the other one on the way in. Nothing saved yet
      // means System, the same default the settings service uses, so the first
      // frame already follows the operating system. An install that predates
      // that default has no stored choice either, and its cached value is
      // corrected from the database as soon as settings open. Keep these keys,
      // the 07:00 and 19:00 defaults, and the dawn-to-dusk rule in step with
      // themeService.ts and domain/appearance/theme.ts. The terminal's own
      // surface and the text size are cached separately, so they can be applied
      // without waiting for the bundle; keep their keys and the "default"
      // fallback in step with themeService.ts and textSizeService.ts.
      function clockMinutes(value) {
        var parts = /^([01][0-9]|2[0-3]):([0-5][0-9])$/.exec(
          typeof value === 'string' ? value : ''
        )
        return parts ? Number(parts[1]) * 60 + Number(parts[2]) : null
      }
      function wantsLightNow(choice) {
        if (choice === 'light') {
          return true
        }
        if (choice === 'dark') {
          return false
        }
        if (choice !== 'schedule') {
          // System, and anything this build does not recognize, follow the OS.
          return (
            typeof window.matchMedia === 'function' &&
            !window.matchMedia('(prefers-color-scheme: dark)').matches
          )
        }

        var schedule = null
        try {
          schedule = JSON.parse(localStorage.getItem('helpdesklab.theme.schedule') || 'null')
        } catch (error) {
          schedule = null
        }
        var dawn = clockMinutes(schedule && schedule.dawn)
        var dusk = clockMinutes(schedule && schedule.dusk)
        if (dawn === null) {
          dawn = 7 * 60
        }
        if (dusk === null) {
          dusk = 19 * 60
        }
        if (dawn === dusk) {
          return false
        }

        var now = new Date()
        var minutes = now.getHours() * 60 + now.getMinutes()
        return dawn < dusk
          ? minutes >= dawn && minutes < dusk
          : minutes >= dawn || minutes < dusk
      }
      try {
        document.documentElement.dataset.theme = wantsLightNow(
          localStorage.getItem('helpdesklab.theme')
        )
          ? 'light'
          : 'dark'
        document.documentElement.dataset.terminal =
          localStorage.getItem('helpdesklab.terminal') === 'follow' ? 'follow' : 'dark'
        // Anything unrecognized, and every install that has never chosen, reads
        // as Default: the size the workspace was laid out at.
        var textSize = localStorage.getItem('helpdesklab.textSize')
        document.documentElement.dataset.textSize =
          textSize === 'small' || textSize === 'large' ? textSize : 'default'
      } catch (error) {
        // Storage can be unavailable; the dark defaults still apply.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
