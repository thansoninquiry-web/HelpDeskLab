name: Check

# The app ships its dependencies to the browser and calls no server of its own,
# so a compromised package is the realistic way this project is attacked. Until
# now nothing checked for one: these runs are the only automated defence.
on:
  push:
  pull_request:

# A new push supersedes the run for the same branch instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned instead of `ubuntu-latest`, which GitHub is moving from 24.04 to
    # 26.04: an alias that can change image overnight adds a per-run migration
    # notice and a way for this check to fail for reasons the change did not
    # cause. Bump this line deliberately, when there is time to watch a run.
    runs-on: ubuntu-24.04
    permissions:
      # Reading the repository is all this job needs.
      contents: read

    steps:
      # Both actions declare the node24 runtime from these majors on; the v4
      # pins were being forced onto node24 with a deprecation warning per run.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json asks for >=20.19.0; 22 is the current LTS.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, lint, test and build
        run: npm run check

      # What the bundle ships is a hard gate: an advisory here runs on a
      # learner's machine.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # A build-time package can still run install scripts, but a freshly
      # disclosed advisory in one should be seen and judged that day rather than
      # block an unrelated change, so this step reports without failing.
      - name: Audit build-time dependencies
        continue-on-error: true
        run: npm audit --audit-level=high
